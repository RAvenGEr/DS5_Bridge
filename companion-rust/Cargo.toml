[package]
name = "companion-rust"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
build = "build.rs"

[dependencies]
active-win-pos-rs = "0.11"
ds5-transport = { path = "crates/ds5-transport" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
tray-icon = "0.26.1"
muda = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6.0"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
